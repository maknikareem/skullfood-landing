    body {

    .container {

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      
      /* --- GLITCH STYLES --- */
      font-family: Georgia, 'Times New Roman', serif; /* Georgia Pro or similar */
      color: #fff; /* Base text color is white */
      position: relative; /* Required for pseudo-elements */
      
      /* Remove old neon styles */
      text-shadow: none; 
      animation: none;
    }
    
    /* --- Glitch pseudo-elements --- */
    h1::before,
    h1::after {
      content: attr(data-text); /* Gets text from the H1's data-text attribute */
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      text-shadow: none; /* Ensure no old shadows are inherited */
    }

    h1::before {
      color: #00ffff; /* Cyan color */
      opacity: 0.7; 
      animation: glitch-anim-1 0.15s infinite linear alternate;
    }

    h1::after {
      color: #ff00ff; /* Magenta color */
      opacity: 0.7; 
      animation: glitch-anim-2 0.2s infinite linear alternate-reverse;
    }

    /* --- Keyframes for Glitch Effect --- */
    @keyframes glitch-anim-1 {
      0% { transform: translate(3px, 2px); } /* Offset */
      100% { transform: translate(-3px, -2px); }
    }

    @keyframes glitch-anim-2 {
      0% { transform: translate(-2px, -3px); }
      100% { transform: translate(2px, 3px); }
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
